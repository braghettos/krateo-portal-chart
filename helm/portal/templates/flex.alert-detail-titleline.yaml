# #83 §0.4: the alert H1 title with the live State tag INLINE directly after it (compact, on the
# title's own line — e.g. "OOMKilled — container exceeded memory limit  ● Pending"), instead of a
# separate full-width chip block below the title. Horizontal, vertically centred, wrapping so a long
# title drops the tag to the next line rather than overflowing. Mirrors flex.incident-detail-titleline.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alert-detail-titleline
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [name, namespace]
  widgetData:
    allowedResources:
    - paragraphs
    - tags
    gap: small
    align: center
    wrap: true
    items:
    - resourceRefId: alert-detail-title
    - resourceRefId: alert-detail-state
  resourcesRefs:
    items:
    - id: alert-detail-title
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alert-detail-title
      namespace: {{ .Release.Namespace }}
      resource: paragraphs
      verb: GET
    - id: alert-detail-state
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alert-detail-state
      namespace: {{ .Release.Namespace }}
      resource: tags
      verb: GET

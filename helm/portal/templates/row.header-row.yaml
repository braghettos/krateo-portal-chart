# #81 §0.1: was a two-COLUMN Row (greeting col + actions col) that put the 24h/7d/30d/All
# range pills on the title line. Restructured to a VERTICAL Flex so the greeting/title/subtitle
# block renders ALONE first and the filter row (range chips + Create button, header-actions-flex,
# justify: flex-end) sits on its OWN row BELOW it — matching the Incidents/Blueprints pattern
# (header block, then filter row as a separate sibling). No widget removed.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: header-row
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - flexes
    vertical: true
    gap: small
    items:
    - resourceRefId: header-greeting-flex
    - resourceRefId: header-actions-flex
  resourcesRefs:
    items:
    - id: header-greeting-flex
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: header-greeting-flex
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: header-actions-flex
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: header-actions-flex
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET

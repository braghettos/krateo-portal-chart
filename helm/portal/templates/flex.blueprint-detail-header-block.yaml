# Page header block — a vertical stack of two rows (issue #78 §4b): the title line
# (name + status Tag) alone on top, then a space-between row beneath it holding
# [ subtitle (left) · actions (Create · Delete) (right) ] center-aligned. Mirrors
# composition-detail-header-block.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: blueprint-detail-header-block
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [name, namespace]
  widgetData:
    vertical: true
    gap: small
    allowedResources:
      - flexes
    items:
      - resourceRefId: blueprint-detail-title-line
      - resourceRefId: blueprint-detail-title-stack
  resourcesRefs:
    items:
      - id: blueprint-detail-title-line
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: blueprint-detail-title-line
        namespace: {{ .Release.Namespace }}
        resource: flexes
        verb: GET
      - id: blueprint-detail-title-stack
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: blueprint-detail-title-stack
        namespace: {{ .Release.Namespace }}
        resource: flexes
        verb: GET

# Alert detail pagehead — just the title-line now (H1 + inline live State tag). #83 cleanup:
#   §0.3 back-link removed (the breadcrumb already covers back-navigation);
#   §0.4 title + State tag folded into flex.alert-detail-titleline (was a separate title row + a
#        full-width chips row);
#   §0.5 the phase/synced meta line moved into the Info card's Descriptions (Phase + Synced rows);
#   §0.7 the "Investigate with Autopilot" CTA moved into the Info card's header action slot.
# So the pagehead is now a single title-line wrapper (kept as its own block so the page structure
# and the incident/composition pagehead parity are unchanged).
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: alert-detail-header-block
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [name, namespace]
  widgetData:
    allowedResources:
    - flexes
    vertical: true
    gap: small
    items:
    - resourceRefId: alert-detail-titleline
  resourcesRefs:
    items:
    - id: alert-detail-titleline
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: alert-detail-titleline
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET

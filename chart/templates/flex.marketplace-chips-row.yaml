# #82 §0.1: marketplace category chips (left) + the catalog search input (right) on ONE line
# (space-between), replacing the standalone chips row + the frontend PageSearch that sat above the grid.
# Mirrors flex.blueprints-filterbar (#75 §0.2). Both children are already-deployed widget kinds
# (listies + inputs, both in the Flex allowedResources enum, verified live).
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-chips-row
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - listies
    - inputs
    # #86 §0.4 Release C (fedepini via DevTools): `justify: center` was the wrong tool — it treats the
    # chips-group + search as ONE block and centres THAT, so the (narrower) search box floats mid-row
    # instead of pinning right. Back to `space-between` (chips left, search right); keep the wider
    # `gap: large` — space-between treats gap as a FLOOR, so the breathing room is preserved.
    justify: space-between
    align: center
    gap: large
    wrap: true
    items:
    - resourceRefId: marketplace-category-chips
    - resourceRefId: marketplace-search
  resourcesRefs:
    items:
    - id: marketplace-category-chips
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: marketplace-category-chips
      namespace: {{ .Release.Namespace }}
      resource: listies
      verb: GET
    - id: marketplace-search
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: marketplace-search
      namespace: {{ .Release.Namespace }}
      resource: inputs
      verb: GET

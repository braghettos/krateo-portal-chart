# Page header (H1 + subtitle) for /marketplace — mirrors the dashboard greeting pattern
# (vertical Flex wrapping a strong title + a secondary subtitle Paragraph).
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-header
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    # #82 §0.3: the count now rides INLINE with the title (marketplace-title-line, a flex), so the
    # header stacks eyebrow → [title · count] → subtitle. `statistics` drops from the enum, `flexes` joins.
    allowedResources:
    - paragraphs
    - flexes
    vertical: true
    items:
    - resourceRefId: marketplace-eyebrow
    - resourceRefId: marketplace-title-line
    - resourceRefId: marketplace-subtitle
  resourcesRefs:
    items:
    - id: marketplace-eyebrow
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: marketplace-eyebrow
      namespace: {{ .Release.Namespace }}
      resource: paragraphs
      verb: GET
    - id: marketplace-title-line
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: marketplace-title-line
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET
    - id: marketplace-subtitle
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: marketplace-subtitle
      namespace: {{ .Release.Namespace }}
      resource: paragraphs
      verb: GET

kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: header-actions-flex
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - buttons
    - listies
    # #80 §0.1: the range chips (24h/7d/30d/All) must sit at the START of the row, not bunched
    # against the right edge with the button. `space-between` puts the chips left and keeps the
    # primary "Create composition" button pinned RIGHT — which also keeps it as the right-edge
    # reference the dashboard panels now align to (#80 §0.2). (`flex-start`, per the issue text,
    # would drag the button left off that edge and undo the §0.2 alignment.)
    justify: space-between
    align: center
    gap: small
    items:
    # The four range-btn-* Buttons collapsed into ONE data-driven Listy(chip)
    # (widget-sprawl collapse) — same targets, default and active logic.
    - resourceRefId: dashboard-range-chips
    - resourceRefId: new-composition
  resourcesRefs:
    items:
    - id: dashboard-range-chips
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: dashboard-range-chips
      namespace: {{ .Release.Namespace }}
      resource: listies
      verb: GET
    - id: new-composition
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: new-composition
      namespace: {{ .Release.Namespace }}
      resource: buttons
      verb: GET

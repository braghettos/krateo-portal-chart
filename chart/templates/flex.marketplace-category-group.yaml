# Marketplace facet bar — the type toggle (Blueprints | Operators | All) stacked over the
# DATA-DRIVEN category chip row, with the sort control (Name A–Z | Recently updated) below.
# All three are Listy(chip) widgets bound to the blueprints-catalog RA (.sources / .categories
# / .sorts). Replaces the old hardcoded krateo.io/category Button chips — the facet now mirrors
# whatever the live catalog actually carries.
apiVersion: widgets.templates.krateo.io/v1beta1
kind: Flex
metadata:
  name: marketplace-category-group
  namespace: {{ .Release.Namespace }}
spec:
  widgetData:
    vertical: true
    gap: small
    # #82 §0.1: the category chips share their row with the catalog search (marketplace-chips-row, a
    # space-between Flex) — hence `flexes` joins the enum. Source toggle above, sort toggle below.
    allowedResources:
      - listies
      - flexes
    items:
      - resourceRefId: marketplace-source-toggle
      - resourceRefId: marketplace-chips-row
      - resourceRefId: marketplace-sort-toggle
  resourcesRefs:
    items:
      - id: marketplace-source-toggle
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: marketplace-source-toggle
        namespace: {{ .Release.Namespace }}
        resource: listies
        verb: GET
      - id: marketplace-chips-row
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: marketplace-chips-row
        namespace: {{ .Release.Namespace }}
        resource: flexes
        verb: GET
      - id: marketplace-sort-toggle
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: marketplace-sort-toggle
        namespace: {{ .Release.Namespace }}
        resource: listies
        verb: GET

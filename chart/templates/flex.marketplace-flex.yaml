# Marketplace page container — stacks the facet bar above the tile grid. The
# /marketplace route points here; the facet chips and the grid compose via URL extras.
apiVersion: widgets.templates.krateo.io/v1beta1
kind: Flex
metadata:
  name: marketplace-flex
  namespace: {{ include "portal.tierNamespace" (dict "ctx" . "tier" "admin") }}
spec:
  widgetData:
    vertical: true
    gap: large
    allowedResources:
      - flexes
      - listies
    items:
      - resourceRefId: marketplace-header
      - resourceRefId: marketplace-filters-row
      - resourceRefId: marketplace-grid
  resourcesRefs:
    items:
      - id: marketplace-header
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: marketplace-header
        namespace: {{ .Release.Namespace }}
        resource: flexes
        verb: GET
      # #86 (fedepini): was marketplace-category-group directly; now the outer space-between
      # marketplace-filters-row (search left, category-group right).
      - id: marketplace-filters-row
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: marketplace-filters-row
        namespace: {{ .Release.Namespace }}
        resource: flexes
        verb: GET
      - id: marketplace-grid
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: marketplace-grid
        namespace: {{ .Release.Namespace }}
        resource: listies
        verb: GET

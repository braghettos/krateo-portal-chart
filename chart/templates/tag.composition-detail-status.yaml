# Status pill next to the title. The conditions→label/color logic lives HERE
# (widget representation), not in the RA: the RA just supplies the raw object.
# Honest rollup: a Ready=True comp whose Synced=False is DRIFTED, not Healthy —
# surface "Drift" (magenta) so a reconcile-paused/diverged comp isn't mislabelled
# green. Mirrors the compositions-list state language (Healthy/Drift/Degraded/Pending).
kind: Tag
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: composition-detail-status
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [name, namespace]
  apiRef:
    name: composition-detail
    namespace: {{ .Release.Namespace }}
  widgetData:
    label: Unknown
    color: default
  # Title tag = the composition's REAL `Ready` condition (not a derived Healthy/Drift label):
  # Ready=True → "Ready" (green — health), Ready=False → "NotReady" (red, the K8s-native
  # kubectl token — never spaced/sentence-cased), absent → "Unknown" (gray).
  # ONE override outranks Ready: the engine's workload projection. workloadHealthy == false
  # (crashlooping / rolling-out pods behind a Ready comp) → the pill must not read green while
  # the actual workload is down. MIRROR the list rail's severity split (.workloadHealthy = RA-
  # exposed raw field): Ready=True + workloadHealthy=false → "Degraded" (gold — reconciled,
  # workload unready: rolling out or degraded, NOT a hard failure); Ready-absent/False +
  # workloadHealthy=false → "Unhealthy" (red). Keeps the detail pill consistent with the
  # /compositions rail, which shows the same case gold — clicking a gold row no longer lands on red.
  widgetDataTemplate:
    - forPath: label
      expression: '${ (.detail.status.conditions // []) as $c | ($c | map(select(.type == "Ready")) | .[0]) as $r | if .workloadHealthy == false then (if ($r != null and $r.status == "True") then "Degraded" else "Unhealthy" end) elif $r == null then "Unknown" elif $r.status == "True" then "Ready" else "NotReady" end }'
    - forPath: color
      expression: '${ (.detail.status.conditions // []) as $c | ($c | map(select(.type == "Ready")) | .[0]) as $r | if .workloadHealthy == false then (if ($r != null and $r.status == "True") then "gold" else "red" end) elif $r == null then "gray" elif $r.status == "True" then "green" else "red" end }'
  resourcesRefs:
    items: []

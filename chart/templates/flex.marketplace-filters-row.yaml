# #86 (fedepini): the "global-container" for the Marketplace facet bar — the catalog search as a
# LEFT slot, the full 3-line filters stack (source toggle / category chips / sort toggle) as a RIGHT
# slot, on ONE horizontal `space-between` row. Replaces the old nesting where search lived INSIDE the
# category-chips row (flex.marketplace-chips-row, now deleted) and so only ever centred against that
# single middle line. Now `justify: space-between; align: center` lands on THIS outer container:
# search pins left and sits vertically centred against the full-height filters block, which reads as
# one coherent right-aligned group. CR-only; both children (an Input + a Flex) are already-deployed
# widget kinds and both are valid Flex allowedResources enum values — no CRD change.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-filters-row
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - inputs
    - flexes
    justify: space-between
    align: center
    gap: large
    wrap: true
    items:
    - resourceRefId: marketplace-search
    - resourceRefId: marketplace-category-group
  resourcesRefs:
    items:
    - id: marketplace-search
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: marketplace-search
      namespace: {{ .Release.Namespace }}
      resource: inputs
      verb: GET
    - id: marketplace-category-group
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: marketplace-category-group
      namespace: {{ .Release.Namespace }}
      resource: flexes
      verb: GET

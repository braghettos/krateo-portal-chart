# #82 §0.2 + §0.3: the catalog cardinality as a small muted count INLINE beside the "Marketplace"
# title (via flex.marketplace-title-line) — replacing the oversized Statistic block that stacked below
# the header with a "CATALOG" eyebrow. A secondary Paragraph ("397 charts") reads as a subtle count on
# the title's line, not a headline number. Bound to blueprints-catalog: `.count` (what the active facets
# show — reflects the grid exactly) + `.countLabel` (the honest noun: charts / blueprints / operators).
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-count
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): the count varies with every facet, so its cache cell must partition on all of
  # them (else a filtered count would be served from the unfiltered cell).
  keyExtras: [category, q, source, sort]
  apiRef:
    name: blueprints-catalog
    namespace: {{ .Release.Namespace }}
  widgetData:
    text: ""
    type: secondary
  widgetDataTemplate:
    # #86 §0.3: wrap the count in parentheses ("(397 charts)") so it reads unambiguously as an
    # annotation OF the "Marketplace" title beside it, not a second word in the heading.
    - forPath: text
      expression: '${ ("(" + (.count | tostring) + " " + (.countLabel // "charts") + ")") }'
  resourcesRefs:
    items: []

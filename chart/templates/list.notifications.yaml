# Header notifications drawer — live k8s event stream via SSE.
# sseEndpoint is resolved against EVENTS_PUSH_API_BASE_URL in useSseStream (relative path).
# dataSource starts empty; the SSE stream populates it at runtime.
kind: Listy
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: list-notifications
  namespace: {{ .Release.Namespace }}
spec:
  widgetData:
    dataSource: []
    sseEndpoint: /notifications
    sseTopic: krateo
    maxItems: 200
    size: small
    split: true
    itemLayout: horizontal
    itemTemplate:
      icon: fa-bell
      color:
        value: '{type}'
        default: gray
        map:
          Normal: blue
          Warning: orange
      primaryText: '{reason}'
      secondaryText: '{lastTimestamp|firstTimestamp|metadata.creationTimestamp}'
      subPrimaryText: '{message}'
      subSecondaryText: '{involvedObject.kind}.{involvedObject.apiVersion}/{involvedObject.namespace}/{involvedObject.name}'
      formats:
        secondaryText: datetime
  resourcesRefs:
    items: []

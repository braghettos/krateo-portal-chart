# Second header row (issue #78 §4b): the subtitle on the left and the action button group
# on the right, share one line with justify space-between and centre alignment — sitting
# BENEATH the title line (name + status), which the header-block now renders on its own row.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: blueprint-detail-title-stack
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [name, namespace]
  widgetData:
    vertical: false
    justify: space-between
    align: center
    gap: middle
    wrap: true
    allowedResources:
      - flexes
      - paragraphs
    items:
      - resourceRefId: blueprint-detail-subtitle
      - resourceRefId: blueprint-detail-actions
  resourcesRefs:
    items:
      - id: blueprint-detail-subtitle
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: blueprint-detail-subtitle
        namespace: {{ .Release.Namespace }}
        resource: paragraphs
        verb: GET
      - id: blueprint-detail-actions
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: blueprint-detail-actions
        namespace: {{ .Release.Namespace }}
        resource: flexes
        verb: GET

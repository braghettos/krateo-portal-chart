# #83 §0.2: RELATED ALERTS label — the triggering-alert link moved OUT of the title-row chips
# (flex.incident-detail-chips) into its own footer section here, next to Similar incidents, so the
# alert reads as a related-link affordance rather than a chip crowding the title. Mirrors
# incident-sec-similar-label (a lightweight strong label above a related-links row).
kind: Paragraph
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: incident-related-alerts-label
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  # F6 (snowplow#130): extras keys that partition this widget's cache cell.
  keyExtras: [name, namespace]
  widgetData:
    text: Related alerts
    strong: true
  resourcesRefs:
    items: []

# #82 §0.3: the "Marketplace" title with the catalog count INLINE beside it (e.g. "Marketplace  397
# charts"), instead of the count as a separate oversized Statistic block stacked below the header.
# Horizontal, vertically centred, wrapping so the count drops below on a narrow header rather than
# overflowing. Mirrors the title-line pattern used on the detail/incident pageheads.
kind: Flex
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: marketplace-title-line
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
spec:
  widgetData:
    allowedResources:
    - paragraphs
    gap: small
    align: center
    wrap: true
    items:
    - resourceRefId: marketplace-title
    - resourceRefId: marketplace-count
  resourcesRefs:
    items:
    - id: marketplace-title
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: marketplace-title
      namespace: {{ .Release.Namespace }}
      resource: paragraphs
      verb: GET
    - id: marketplace-count
      apiVersion: widgets.templates.krateo.io/v1beta1
      name: marketplace-count
      namespace: {{ .Release.Namespace }}
      resource: paragraphs
      verb: GET

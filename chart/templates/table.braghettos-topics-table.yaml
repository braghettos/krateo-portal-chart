apiVersion: widgets.templates.krateo.io/v1beta1
kind: Table
metadata:
  name: braghettos-topics-table
  namespace: krateo-system
spec:
  apiRef:
    name: braghettos-repos
    namespace: krateo-system
  resourcesRefs:
    items: []
  widgetData:
    allowedResources: []
    columns:
      - title: Repository
        valueKey: name
      - title: Topics
        valueKey: topics
      - title: Language
        valueKey: language
      - title: Stars
        valueKey: stars
  widgetDataTemplate:
    - expression: ${ [ .items[]? | [ {valueKey:"name",kind:"jsonSchemaType",type:"string",stringValue:.name}, {valueKey:"topics",kind:"jsonSchemaType",type:"string",stringValue:(if ((.topics // []) | length) > 0 then (.topics | join(", ")) else "untagged" end)}, {valueKey:"language",kind:"jsonSchemaType",type:"string",stringValue:(.language // "N/A")}, {valueKey:"stars",kind:"jsonSchemaType",type:"string",stringValue:(.stargazers_count | tostring)} ] ] }
      forPath: dataSource
